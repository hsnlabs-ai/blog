<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #090a0f;
    --card: #11141d;
    --border: #222736;
    --cyan: #52b4fd;
    --cyan-dim: rgba(82, 180, 253, 0.15);
    --text: #f1f5f9;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h2 { font-size: 1.25rem; margin-bottom: 6px; font-weight: 600; letter-spacing: -0.01em; }
  p { font-size: 0.85rem; color: var(--muted); margin-bottom: 24px; text-align: center; max-width: 540px; }

  /* INDICADOR DE ETAPAS */
  .stepper {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 24px;
  }
  .step-pill {
    padding: 6px 14px;
    border-radius: 9999px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    transition: all 0.3s ease;
  }
  .step-pill.active {
    background: var(--cyan);
    color: #000;
    border-color: var(--cyan);
    box-shadow: 0 0 14px rgba(82, 180, 253, 0.35);
  }
  .step-arrow {
    color: var(--muted);
    font-size: 0.8rem;
  }

  /* STAGE CENTRAL */
  .stage-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 20px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
  }
  .stage-box {
    width: 220px;
    height: 220px;
    background: #000;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    margin-bottom: 20px;
  }
  .water-box {
    width: 140px;
    height: 140px;
    background: var(--cyan);
    position: relative;
    overflow: hidden;
  }
  .carp-img {
    position: absolute;
    width: 76px;
    height: 76px;
    top: 8px;
    right: 8px;
    pointer-events: none;
    user-select: none;
    z-index: 10;
  }
  .canvas-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 140px;
    height: 140px;
    z-index: 2;
    pointer-events: none;
  }

  /* CONTROLES */
  .controls {
    display: flex;
    gap: 12px;
  }
  .btn {
    padding: 8px 18px;
    border-radius: 6px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid var(--border);
    background: #181d29;
    color: var(--text);
  }
  .btn:hover {
    border-color: var(--cyan);
    color: #fff;
  }
  .btn-primary {
    background: var(--cyan);
    color: #000;
    border-color: var(--cyan);
  }
  .btn-primary:hover {
    background: #73c5fe;
  }

  .info-bar {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 14px;
    line-height: 1.5;
    max-width: 480px;
  }
</style>
</head>
<body>

  <div class="controls">
    <button class="btn btn-primary" id="btn-trigger">Disparar Sequência</button>
    <button class="btn" id="btn-reset">Resetar para Etapa 1</button>
  </div>

  <div class="info-bar" id="status-desc">
    Etapa 1 ativa: Água sólida em repouso estático absoluto. Zero consumo de processamento.
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById("stage-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const W = 140;
  const H = 140;

  // Estados: 1 = Parado, 2 = Reverberando, 3 = Lagoa Viva Sutil
  let currentStep = 1;

  let buffer1 = new Float32Array(W * H);
  let buffer2 = new Float32Array(W * H);
  const damping = 0.982; // Amortecimento de lagoa

  const baseR = 82, baseG = 180, baseB = 253; // #52b4fd
  const imgData = ctx.createImageData(W, H);

  let causticWeight = 0.0;
  let targetCaustic = 0.0;
  let timeVal = 0;
  let waveEnergy = 0;

  // UI elements
  const pill1 = document.getElementById("step-1");
  const pill2 = document.getElementById("step-2");
  const pill3 = document.getElementById("step-3");
  const statusDesc = document.getElementById("status-desc");

  function setStepUI(step) {
    currentStep = step;
    pill1.classList.toggle("active", step === 1);
    pill2.classList.toggle("active", step === 2);
    pill3.classList.toggle("active", step === 3);

    if (step === 1) {
      statusDesc.textContent = "Etapa 1 ativa: Água sólida em repouso estático absoluto. Zero consumo de processamento.";
    } else if (step === 2) {
      statusDesc.textContent = "Etapa 2 ativa: Perturbação cai no meio da carpa. Ondas físicas viajam e rebatem nas bordas.";
    } else if (step === 3) {
      statusDesc.textContent = "Etapa 3 ativa: A energia inicial assentou. A água despertou e mantém marolas de lagoa viva bem sutis.";
    }
  }

  function drop(cx, cy, radius, strength) {
    for (let y = Math.max(1, cy - radius); y < Math.min(H - 1, cy + radius); y++) {
      for (let x = Math.max(1, cx - radius); x < Math.min(W - 1, cx + radius); x++) {
        const d = Math.hypot(x - cx, y - cy);
        if (d < radius) {
          buffer1[y * W + x] += strength * Math.cos((d / radius) * (Math.PI / 2));
        }
      }
    }
  }

  function triggerMotion() {
    // Dispara gota no meio exato da carpa: x=96, y=46 em escala 140x140
    drop(96, 46, 6, 280);
    setStepUI(2);
    targetCaustic = 0.65; // Desperta o modo lagoa viva sutil
  }

  function resetToStatic() {
    buffer1.fill(0);
    buffer2.fill(0);
    causticWeight = 0.0;
    targetCaustic = 0.0;
    timeVal = 0;
    setStepUI(1);
    renderFrame();
  }

  function renderFrame() {
    // Suavização do peso das cáusticas
    causticWeight += (targetCaustic - causticWeight) * 0.02;
    timeVal += 0.02;

    // Etapa 2: Simulação de onda 2D
    let localEnergy = 0;
    for (let y = 1; y < H - 1; y++) {
      const row = y * W;
      for (let x = 1; x < W - 1; x++) {
        const idx = row + x;
        let val = (
          buffer1[idx - 1] +
          buffer1[idx + 1] +
          buffer1[idx - W] +
          buffer1[idx + W]
        ) * 0.5 - buffer2[idx];

        val *= damping;
        buffer2[idx] = val;
        localEnergy += Math.abs(val);
      }
    }

    const temp = buffer1;
    buffer1 = buffer2;
    buffer2 = temp;
    waveEnergy = localEnergy;

    // Transição automática de Etapa 2 para Etapa 3 quando a onda mecânica assentar
    if (currentStep === 2 && waveEnergy < 250 && causticWeight > 0.45) {
      setStepUI(3);
    }

    // Se estiver em Etapa 1 pura sem cáustica e sem onda, renderiza estático plano
    const data = imgData.data;
    for (let i = 0; i < W * H; i++) {
      const x = i % W;
      const y = Math.floor(i / W);
      const pIdx = i * 4;

      if (x === 0 || x === W - 1 || y === 0 || y === H - 1) {
        data[pIdx] = baseR;
        data[pIdx + 1] = baseG;
        data[pIdx + 2] = baseB;
        data[pIdx + 3] = 255;
        continue;
      }

      // Modulação de onda mecânica
      const dx = buffer1[i + 1] - buffer1[i - 1];
      const dy = buffer1[i + W] - buffer1[i - W];
      const waveMod = (dx + dy) * 1.6;

      // Modulação de lagoa contínua sutil
      let causticMod = 0;
      if (causticWeight > 0.005) {
        const nx = x * 0.055;
        const ny = y * 0.055;
        causticMod = (
          Math.sin(nx + timeVal * 0.75) * Math.cos(ny - timeVal * 0.65) +
          Math.sin(nx * 1.4 - timeVal * 0.45) * Math.sin(ny * 1.2 + timeVal * 0.8)
        ) * 14.0 * causticWeight;
      }

      const totalMod = waveMod + causticMod;

      data[pIdx] = Math.max(0, Math.min(255, baseR + totalMod * 0.85));
      data[pIdx + 1] = Math.max(0, Math.min(255, baseG + totalMod * 0.95));
      data[pIdx + 2] = Math.max(0, Math.min(255, baseB + totalMod));
      data[pIdx + 3] = 255;
    }

    ctx.putImageData(imgData, 0, 0);

    // Se estiver em Etapa 1 parada, congela o loop para poupar CPU
    if (currentStep === 1 && waveEnergy < 5 && causticWeight < 0.005) {
      return;
    }

    requestAnimationFrame(renderFrame);
  }

  // Eventos de gatilho
  const triggerArea = document.getElementById("water-trigger");
  triggerArea.addEventListener("mouseenter", () => {
    if (currentStep === 1) {
      triggerMotion();
      requestAnimationFrame(renderFrame);
    } else if (currentStep === 3) {
      // Nova onda leve na lagoa viva
      drop(96, 46, 5, 200);
    }
  });

  triggerArea.addEventListener("click", () => {
    triggerMotion();
    requestAnimationFrame(renderFrame);
  });

  document.getElementById("btn-trigger").addEventListener("click", () => {
    triggerMotion();
    requestAnimationFrame(renderFrame);
  });

  document.getElementById("btn-reset").addEventListener("click", resetToStatic);

  // Render inicial estático
  renderFrame();
})();
</script>

</body>
</html>
