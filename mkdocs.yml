site_name: Hugo Nascimento
site_url: https://hsnlabs.ai/blog/
site_author: Hugo Nascimento
site_description: Deterministic Agentic Engineering — Essays and field notes on enterprise AI architectures, business ontologies, and avoiding runtime failures in production.

theme:
  name: simple-blog
  blog:
    layout: compact
    author: Hugo Nascimento
    cta_label: Ler Artigo
  components:
    blog_sidebar:
      recent_posts: true
      categories: true
      tags: true
      recent_count: 5

plugins:
  - search
  - simple-blog-posts:
      posts_dir: post

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
  - attr_list

nav:
  - Home: index.md
