site_name: Hugo S. Nascimento
site_url: https://hsnlabs.ai/blog/
site_author: Hugo S. Nascimento
site_description: Enterprise Agent Architecture — Posts and field notes on enterprise AI architectures, business ontologies, and avoiding runtime failures in production.

hooks:
  - hooks/attribution.py

theme:
  name: simple-blog
  custom_dir: overrides
  blog:
    layout: compact
    author: Hugo S. Nascimento
    cta_label: Read Post
  components:
    blog_sidebar:
      recent_posts: true
      categories: true
      tags: true
      recent_count: 5

extra_css:
  - stylesheets/extra.css
  - assets/css/pagination.css

extra_javascript:
  - assets/js/pagination.js
  - assets/js/relative_dates.js
  - assets/js/mermaid_init.js

plugins:
  - search
  - simple-blog-posts:
      posts_dir: post
  - rss:
      match_path: "post/.*md"
      feed_ttl: 1440
      image: "https://hsnlabs.ai/blog/assets/brand/symbol/symbol-square-pure-cyan.png"
      feed_title: "Hugo Nascimento — Enterprise Agent Architecture"
      feed_description: "Posts and field notes on deterministic agent architectures, domain ontologies, and avoiding runtime failures in production."
      categories:
        - category
        - tags
      pretty_print: true
      json_feed_enabled: true
      feeds_filenames:
        rss_created: feed_rss_created.xml
        rss_updated: feed_rss_updated.xml
        json_created: feed_json_created.json
        json_updated: feed_json_updated.json
      date_from_meta:
        as_creation: date
        as_update: date
        datetime_format: "%Y-%m-%d"

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - attr_list

nav:
  - Home: index.md
