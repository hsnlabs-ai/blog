<!-- block header -->
<div class="blog-header-inner">
  <div class="blog-header-brand-group">
    <a href="https://hsnlabs.ai" class="blog-brand-link" title="HSN Labs Main Site">
      <img src="{{ 'assets/brand/lockups/hsnlabs-lockup-horizontal-light.png'|url }}" alt="HSN Labs" class="blog-brand-logo">
    </a>
    <span class="blog-brand-sep" aria-hidden="true">/</span>
    <a href="{{ ''|url }}" class="blog-badge-link" title="HSN Labs Blog">
      <span class="blog-badge-text">Blog</span>
    </a>
  </div>

  <nav class="blog-header-menu" aria-label="Main Navigation">
    <a href="{{ ''|url }}" class="blog-nav-link {% if page and page.is_homepage %}active{% endif %}">All Essays</a>
    <a href="https://hsnlabs.ai/bootcamp" class="blog-nav-link">Bootcamp</a>
    <a href="https://hsnlabs.ai/advisory" class="blog-nav-link">Advisory</a>
    <a href="{{ 'about/resume/'|url }}" class="blog-nav-link {% if page and 'about' in page.url %}active{% endif %}">About Hugo</a>
  </nav>

  <div class="blog-header-actions">
    <button class="blog-action-icon blog-search-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#collapseExample" aria-expanded="false" aria-controls="collapseExample" title="Search essays" aria-label="Search essays">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </button>
    
    <a href="{{ 'feed_rss_created.xml'|url }}" class="blog-action-icon blog-rss-link" title="RSS Feed 2.0" target="_blank" rel="noopener" aria-label="RSS Feed">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M6.18 15.64a2.18 2.18 0 0 1 2.18 2.18C8.36 19 7.38 20 6.18 20C5 20 4 19 4 17.82a2.18 2.18 0 0 1 2.18-2.18M4 4.44A15.56 15.56 0 0 1 19.56 20h-2.83A12.73 12.73 0 0 0 4 7.27V4.44m0 5.66a9.9 9.9 0 0 1 9.9 9.9h-2.83A7.07 7.07 0 0 0 4 12.93v-2.83z"/>
      </svg>
    </a>

    <a href="https://hsnlabs.ai/bootcamp" class="btn btn-primary blog-header-cta">Apply for Bootcamp</a>
  </div>
</div>
<!-- endblock -->
